<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs</title>
    <link rel="stylesheet" href="equestrian.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Lora:ital,wght@0,400..700;1,400..700&family=Rouge+Script&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="logs-container">

        <aside class="left-sidebar">
            <div class="left-sidebar-top">
                <img src="/Users/leannebrown/Documents/repos/Equestrian Project/vecteezy_horses-logo-design-vector-illustration_6627078_932/vecteezy_horses-logo-design-vector-illustration_6627078.jpg"
                    alt="EquiLog logo" class="logo">
                <div class="logo-text">
                    <h1>EquiLog</h1>
                    <p> Training & Logs</p>
                </div>
            </div>
            <nav class="left-sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="logs.html">Training Log</a>
                <a href="#">Schedule</a>
            </nav>
        </aside>
        <main class="log-info">
            <div class="header">
                <div class="header-text">
                    <h1 class="training-log">Training Log</h1>
                    <p class="log-text">Track and manage all training sessions</p>
                </div>
                <button class="log-button" id=""> + Log Session</button>
            </div>
            <div class="form-card">
                <form class="search-bar">
                    <div class="input-group">
                        <input type="search" id="search" placeholder=" " class="search-box" name="q" />
                        <label for="search">Search Sessions</label>
                    </div>
                </form>
                <label for="horse-dropdown" class="sr-only">Filter by horse</label>
                <select id="horse-dropdown">
                    <option value="">All horses</option>
                </select>
            </div>
            <section class="horse-data">
                <div class="horse-data-heading">
                    <span class="horse-data-headers">Horse</span>
                    <span class="horse-data-headers">Date</span>
                    <span class="horse-data-headers">Activity</span>
                    <span class="horse-data-headers">Duration</span>
                    <span class="horse-data-headers">Rating</span>
                    <span class="horse-data-headers">Notes</span>
                </div>
            </section>
        </main>
    </div>
    <div class="modal-overlay" id="log-modal">
            <div class="modal-card">


                <form class="modal-form">
                    <div class="form-row">
                        <div class="form-group">

                            <label for="horse-choices">Horse *</label>
                            <select id="horse-choices" name="horse-choices">
                                <option value="" disabled selected>Select a Horse</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="activity-choices">Activity *</label>
                            <select id="activity-choices" name="activity-choices">
                                <option value="" disabled selected>Select Activity</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="training-date">Date *</label>
                            <input type="date" id="training-date" name="date-start">
                        </div>
                        <div class="form-group">
                            <label for="training-duration">Duration *</label>
                            <input type="text" id="training-duration" name="training">
                        </div>
                    </div>


                    <div class="form-group">
                        <label for="notes">Notes *</label>
                        <textarea id="notes" name="notes">Describe the session, progress, challenges etc.</textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="save-training-button">Save Session</button>
                        <button class="cancel-training-button">Cancel</button>
                    </div>
                </form>

            </div>
        </div>
    <script src="logs.js"></script>
</body>

</html>
